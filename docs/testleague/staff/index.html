<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Everything relative resolves against the team folder, one level up: config.js, data/, logo.png, ../js/. -->
<base href="../">
<!-- Search engines are asked to leave this page alone (also in /robots.txt). Not a lock: nothing here is secret. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1620">
<title>Test League 12U staff | Check The Rink</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking the first paint: the page shows in a system font until the web fonts arrive. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700&family=Chivo+Mono:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="../css/rink.css">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="League staff">

<!-- ============================================================
     THE LEAGUE STAFF PAGE. Same code as the league page one folder up,
     with the staff view switched on: the Ice slots card, the scheduling
     tool, and ?check. Nothing to edit here; the config is ../config.js.
     ============================================================ -->
<script>window.RINK_STAFF = true;</script>
<script src="config.js"></script>

<!-- ============================================================
     Check The Rink: this team's club colors, from ../teams.js.
     Runs before the page paints. Nothing here to edit: the club's
     two colors live in teams.js.
     ============================================================ -->
<script src="../theme.js"></script>
<script src="../teams.js"></script>
<script>
  if (window.CheckTheRinkTheme) {
    window.CheckTheRinkTheme.applyTeamPage();
  }
</script>
</head>
<body>
<div id="app"></div>

<!-- ============================================================
     The page itself lives in ../js/, one module per responsibility.
     Start at ../js/app.js; the map is in ARCHITECTURE.md at the repo root.
     Served as native ES modules: no build step, no bundler. Open it
     through a web server (python3 -m http.server), not as a file://.
     ============================================================ -->
<script type="module" src="../js/app.js"></script>
</body>
</html>
