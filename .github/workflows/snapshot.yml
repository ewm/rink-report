# Saves a copy of every team's Google Sheet every six hours.
#
# Each team page lives in its own folder under docs/ (docs/wswings12u/ and
# so on) and reads <its folder>/data/<tab>.csv only when Google itself
# can't be reached. The files double as a backup of each sheet, with full
# history in git. Nothing is committed when no sheet has changed. Run it by
# hand from the Actions tab ("Run workflow") after a big edit if you want
# the copies fresh right away.
#
# A folder counts as a team when its index.html has a sheetId in it. Only
# folders are looked at, so the landing page at docs/index.html never is.
name: Save a copy of the sheet

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v4

      - name: Fetch every tab of every team's sheet as CSV
        run: |
          set -e
          shopt -s nullglob
          found=0

          for page in */index.html; do
            team=$(dirname "$page")
            SHEET=$(grep -o 'sheetId: *"[^"]*"' "$page" | sed 's/.*"\(.*\)"/\1/' || true)

            if [ -z "$SHEET" ]; then
              echo "$team: no sheetId in index.html, not a team page; skipping"
              continue
            fi

            found=1
            GIDS=$(grep -o 'gids: *{[^}]*}' "$page" || true)
            mkdir -p "$team/data"
            got=0

            for tab in settings teams schedule stats rinks sponsors; do
              gid=$(echo "$GIDS" | grep -o "$tab: *\"[0-9]*\"" | grep -o '[0-9]*' || true)

              if [ -z "$gid" ]; then
                continue
              fi

              url="https://docs.google.com/spreadsheets/d/$SHEET/export?format=csv&gid=$gid"
              out="$team/data/$tab.csv"

              if curl -fsSL --max-time 30 "$url" -o "$out.new"; then
                if head -c 1 "$out.new" | grep -q '<'; then
                  echo "$team/$tab: got a web page, not data; keeping the old copy"
                  rm -f "$out.new"
                else
                  mv "$out.new" "$out"
                  got=1
                fi
              else
                echo "$team/$tab: could not be fetched; keeping the old copy"
                rm -f "$out.new"
              fi
            done

            if [ "$got" = 1 ]; then
              date -u +%Y-%m-%dT%H:%M:%SZ > "$team/data/updated.txt"
            fi
          done

          if [ "$found" = 0 ]; then
            echo "No team folders found under docs/. Nothing to save."
          fi

      - name: Commit when a tab changed
        run: |
          git config user.name "rink-report snapshot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          dirs=(*/data)

          if [ ${#dirs[@]} -eq 0 ]; then
            echo "no team data folders; nothing to commit"
            exit 0
          fi

          git add "${dirs[@]}"

          if git diff --cached --quiet -- . ':(exclude)*/data/updated.txt'; then
            echo "no sheet changed since the last copy"
            exit 0
          fi

          git commit -m "Snapshot: copy of the sheets at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
