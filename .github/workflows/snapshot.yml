# Saves a copy of every team's Google Sheet once a day (about 3 AM Eastern),
# and writes down what changed since the last copy.
#
# Each team page lives in its own folder under docs/ (docs/wswings12u/ and
# so on) and reads <its folder>/data/<tab>.csv only when Google itself
# can't be reached. The files double as a backup of each sheet, with full
# history in git. Nothing is committed when no sheet has changed. Run it by
# hand from the Actions tab ("Run workflow") after a big edit if you want
# the copies fresh right away.
#
# Change report: before a tab's copy is replaced, sheet-changes.py compares
# the old and new copies and lists every changed cell, added row and removed
# row in plain words, with the row number as Google Sheets shows it. The list
# goes to changes/<team>/<date>.md at the top of the repo (outside docs/, so
# the website never serves it) and onto the run's page on the Actions tab.
# A day with more than one run gets one section per run in the same file.
#
# A folder counts as a team when its index.html has a sheetId in it. Only
# folders are looked at, so the landing page at docs/index.html never is.
#
# Players' full names never get saved. Any Player or Goalie column holding
# more than a first name and last initial ("Luke G.") makes the job keep the
# old copy of that tab, commit the rest, and then go red so GitHub emails the
# repo owners. The repo is public history: a name saved once stays there.
name: Save a copy of the sheet

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v4

      - name: Fetch every tab of every team's sheet as CSV
        run: |
          set -e
          shopt -s nullglob
          found=0

          for page in */index.html; do
            team=$(dirname "$page")
            SHEET=$(grep -o 'sheetId: *"[^"]*"' "$page" | sed 's/.*"\(.*\)"/\1/' || true)

            if [ -z "$SHEET" ]; then
              echo "$team: no sheetId in index.html, not a team page; skipping"
              continue
            fi

            found=1
            report="$RUNNER_TEMP/$team-changes.md"
            : > "$report"
            previous=$(cat "$team/data/updated.txt" 2>/dev/null || true)
            GIDS=$(grep -o 'gids: *{[^}]*}' "$page" || true)
            mkdir -p "$team/data"
            got=0

            for tab in settings teams schedule stats rinks sponsors; do
              gid=$(echo "$GIDS" | grep -o "$tab: *\"[0-9]*\"" | grep -o '[0-9]*' || true)

              if [ -z "$gid" ]; then
                continue
              fi

              url="https://docs.google.com/spreadsheets/d/$SHEET/export?format=csv&gid=$gid"
              out="$team/data/$tab.csv"

              if curl -fsSL --max-time 30 "$url" -o "$out.new"; then
                if head -c 1 "$out.new" | grep -q '<'; then
                  echo "$team/$tab: got a web page, not data; keeping the old copy"
                  rm -f "$out.new"
                elif ! python3 "$GITHUB_WORKSPACE/.github/workflows/check-names.py" "$out.new"; then
                  echo "$team/$tab: has full player names; NOT saved, keeping the old copy"
                  echo "$team/$tab" >> "$GITHUB_WORKSPACE/refused.txt"
                  rm -f "$out.new"
                else
                  if ! cmp -s "$out" "$out.new"; then
                    python3 "$GITHUB_WORKSPACE/.github/workflows/sheet-changes.py" "$out" "$out.new" "${tab^}" >> "$report" \
                      || echo "$team/$tab: saved, but its changes could not be listed"
                  fi

                  mv "$out.new" "$out"
                  got=1
                fi
              else
                echo "$team/$tab: could not be fetched; keeping the old copy"
                rm -f "$out.new"
              fi
            done

            if [ "$got" = 1 ]; then
              date -u +%Y-%m-%dT%H:%M:%SZ > "$team/data/updated.txt"
            fi

            # Write the change report, when anything changed.
            if [ -s "$report" ]; then
              day=$(TZ=America/New_York date +%Y-%m-%d)
              now=$(TZ=America/New_York date '+%b %-d, %-I:%M %p')
              log="$GITHUB_WORKSPACE/changes/$team/$day.md"
              since="the first copy"

              if [ -n "$previous" ]; then
                since=$(TZ=America/New_York date -d "$previous" '+%b %-d, %-I:%M %p' 2>/dev/null || echo "$previous")
              fi

              mkdir -p "$(dirname "$log")"

              if [ ! -f "$log" ]; then
                printf '# %s: sheet changes, %s\n\nTimes are Eastern.\n\n' "$team" "$day" > "$log"
              fi

              printf '## Copy taken %s (changes since %s)\n\n' "$now" "$since" >> "$log"
              cat "$report" >> "$log"
              { printf '## %s: changes since %s\n\n' "$team" "$since"; cat "$report"; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [ "$found" = 0 ]; then
            echo "No team folders found under docs/. Nothing to save."
          fi

      - name: Commit when a tab changed
        run: |
          git config user.name "rink-report snapshot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          dirs=(*/data)

          if [ ${#dirs[@]} -eq 0 ]; then
            echo "no team data folders; nothing to commit"
            exit 0
          fi

          git add "${dirs[@]}"

          if [ -d "$GITHUB_WORKSPACE/changes" ]; then
            git add "$GITHUB_WORKSPACE/changes"
          fi

          if git diff --cached --quiet -- . ':(exclude)*/data/updated.txt'; then
            echo "no sheet changed since the last copy"
            exit 0
          fi

          files=$(git diff --cached --name-only)
          git commit -m "Snapshot: copy of the sheets at $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -m "Files saved (the day's change list is under changes/):" -m "$files"
          git push

      - name: Go red if a tab was refused for full names
        run: |
          if [ -f "$GITHUB_WORKSPACE/refused.txt" ]; then
            echo "These tabs were not saved because they hold players' full names."
            echo "Change the names in the sheet to first name + last initial (Luke G.)."
            cat "$GITHUB_WORKSPACE/refused.txt"
            exit 1
          fi
